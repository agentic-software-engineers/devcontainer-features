name: Docs
on:
  pull_request:
    paths:
      - docs/**
      - .github/workflows/docs.yaml
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docs.yaml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      # check out the docs the site is built from
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # provide the Node runtime the site builds with
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5

      # install the site's packages at the versions the lockfile pins
      - run: npm ci --ignore-scripts --no-audit --no-fund

      # check the types, then build the static site into out/
      - run: npm run types:check
      - run: npm run build

      # hand the site to the deploy job, and to reviewers of a pull request as a download
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # one deploy at a time, each finishing before the next starts
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # publish the built site to GitHub Pages
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
